<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
    <div class="container">
        <a class="navbar-brand" href="index.html">🔴 Pokédex</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="index.html">Pokédex</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="entrenadores.html">Entrenadores</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="equipos.html">Equipos</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h1 class="section-title">Pokédex</h1>

    <div class="row mb-4">
        <div class="col-md-4">
            <select id="generation" class="form-select">
                <option value="0,151">Primera Generación (001–151)</option>
                <option value="151,100">Segunda Generación (152–251)</option>
                <option value="251,135">Tercera Generación (252–386)</option>
                <option value="386,107">Cuarta Generación (387–493)</option>
                <option value="493,156">Quinta Generación (494–649)</option>
            </select>
        </div>
    </div>

    <div id="pokemonList" class="row g-3"></div>

</div>

<!-- Modal Pokémon -->
<div class="modal fade" id="pokemonModal">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header bg-danger text-white">
                <h5 id="pokemonTitle" class="modal-title fw-bold"></h5>
                <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <div class="text-center mb-3">
                    <img id="pokemonImage" class="img-fluid" style="max-height:220px">
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <p id="pokemonInfo"></p>
                        <h6 class="fw-bold">Tipos</h6>
                        <p id="pokemonTypes"></p>
                        <h6 class="fw-bold">Habilidades</h6>
                        <p id="pokemonAbilities"></p>
                    </div>
                    <div class="col-md-6">
                        <h6 class="fw-bold">Movimientos (primeros 15)</h6>
                        <p id="pokemonMoves"></p>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
